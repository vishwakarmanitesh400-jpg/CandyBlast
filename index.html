<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1,user-scalable=no">
<title>Candy Blast 3D - Candy Crush Style</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Fredoka',sans-serif;background:#87e1ff;overflow:hidden}
.header{position:fixed;top:0;width:100%;z-index:100;background:linear-gradient(#fff,#ffd6ec);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 0 #ff2d7a;border-radius:0 0 18px 18px}
#scroll{height:100vh;overflow-y:auto;padding-top:70px;background:linear-gradient(180deg,#87e1ff 0%,#a8f0a0 35%,#7dd87d 100%)}
.world{position:relative;max-width:420px;margin:0 auto;height:4200px}
.road{position:absolute;left:50%;width:150px;margin-left:-75px;height:100%;background:repeating-linear-gradient(#ffb3d0 0 24px,#fff 24px 48px);border-left:14px solid #ff7aa8;border-right:14px solid #ff7aa8;border-radius:120px;z-index:1}
.dot{position:absolute;left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;z-index:10;box-shadow:0 8px 0 #a8003a,0 15px 25px rgba(0,0,0,.3);cursor:pointer;transform:perspective(400px) rotateX(18deg)}
.dot.ok{background:radial-gradient(#fff,#ff3d8a 50%,#c0003a)}.dot.lock{background:radial-gradient(#ddd,#666);box-shadow:0 8px 0 #444}
.dot.cur{animation:bounce.7s infinite alternate}
@keyframes bounce{to{transform:perspective(400px) rotateX(5deg) translateY(-12px) scale(1.15)}}
.hut{position:absolute;z-index:5;font-size:54px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
#game{position:fixed;inset:0;z-index:200;background:radial-gradient(#ff9ed2,#7c3aed);display:none;flex-direction:column}
#game.on{display:flex}
.grid{width:92vw;max-width:360px;aspect-ratio:1;background:linear-gradient(#fff,#ffe6f2);margin:12px auto;border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;border:4px solid #fff;box-shadow:0 12px 0 #e89ab8,0 25px 50px rgba(0,0,0,.4)}
.c{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 5px 0 rgba(0,0,0,.15);transform:perspective(300px) rotateX(14deg);transition:.2s}
.c.sel{transform:translateY(-14px) scale(1.25) rotateX(0);box-shadow:0 16px 30px rgba(0,0,0,.5)}
.b0{background:linear-gradient(#ff7a7a,#ff1a1a)}.b1{background:linear-gradient(#7aff8a,#00e63a)}.b2{background:linear-gradient(#7ab8ff,#1a8aff)}.b3{background:linear-gradient(#ffec7a,#ffcc00)}.b4{background:linear-gradient(#d78aff,#9d1aff)}.b5{background:linear-gradient(#7affef,#00e6c8)}
</style>
</head>
<body>
<div class="header">
<div>🍭 CANDY BLAST 3D</div>
<div style="display:flex;gap:8px">
<button id="musicBtn" style="background:#fff;border:2px solid #ff2d7a;border-radius:20px;padding:4px 10px">🔊</button>
<span style="background:gold;padding:5px 10px;border-radius:20px;border:2px solid #fff">🪙 <span id="coin">250</span></span>
</div>
</div>
<div id="scroll"><div class="world" id="world"><div class="road"></div></div></div>

<div id="game">
<div style="display:flex;justify-content:space-between;padding:12px;color:#fff;font-weight:700"><span onclick="closeGame()" style="background:#fff;color:#ff2d7a;padding:6px 14px;border-radius:20px">⬅️ MAP</span><span>LEVEL <b id="lv">1</b></span><span>MOVES <b id="mv">20</b></span></div>
<div class="grid" id="grid"></div>
<div style="text-align:center;color:#fff;margin-top:10px;font-size:18px">✨ Match 3 Candies ✨<br><small>Drag & Swap</small></div>
</div>

<audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_1a2a8f6b8e.mp3"></audio>
<script>
let unlocked=parseInt(localStorage.getItem('cb3_unlocked')||'1');
let coins=parseInt(localStorage.getItem('cb3_coins')||'250');
document.getElementById('coin').innerText=coins;

// Music
let bgm=document.getElementById('bgm'); let isPlay=false;
document.getElementById('musicBtn').onclick=()=>{
 if(!isPlay){bgm.volume=0.4;bgm.play();document.getElementById('musicBtn').innerText='🔊';isPlay=true}
 else{bgm.pause();document.getElementById('musicBtn').innerText='🔇';isPlay=false}
};
function sfx(freq){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();let g=ctx.createGain();o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);g.gain.value=0.3;o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);o.stop(ctx.currentTime+0.3)}catch(e){}}

// Build scroll map
let world=document.getElementById('world');
let arts=[{x:5,y:150,t:'🍭'},{x:77,y:260,t:'🍄'},{x:7,y:420,t:'🏠'},{x:78,y:560,t:'🌳'},{x:6,y:760,t:'🍭'},{x:76,y:920,t:'🏰'},{x:8,y:1150,t:'🍬'},{x:77,y:1380,t:'🍄'},{x:5,y:1680,t:'🍭'},{x:76,y:1880,t:'🌈'},{x:7,y:2150,t:'🏠'},{x:78,y:2420,t:'🍭'},{x:6,y:2720,t:'🍄'},{x:76,y:3000,t:'👑'},{x:7,y:3350,t:'🍭'}];
arts.forEach(a=>{let e=document.createElement('div');e.className='hut';e.style.left=a.x+'%';e.style.top=a.y+'px';e.innerText=a.t;world.appendChild(e)});
for(let i=1;i<=100;i++){
 let y=4000-(i*38); let zig=(i%3==0?22:i%3==1?-22:0); let x=50+zig;
 let d=document.createElement('div'); d.className='dot '+(i>unlocked?'lock':(i==unlocked?'ok cur':'ok')); d.style.top=y+'px'; d.style.left=x+'%'; d.innerText=i>unlocked?'🔒':i;
 d.onclick=()=>{if(i>unlocked){sfx(150);alert('🔒 Locked');return}openGame(i)};
 world.appendChild(d);
}
setTimeout(()=>document.getElementById('scroll').scrollTop=4000-(unlocked*38)-300,500);

let cur=1;
function openGame(n){cur=n;document.getElementById('lv').innerText=n;document.getElementById('mv').innerText=20+Math.floor(n/4);document.getElementById('game').classList.add('on');build();sfx(600);if(!isPlay){bgm.volume=0.4;bgm.play().catch(()=>{});isPlay=true}}
function closeGame(){document.getElementById('game').classList.remove('on')}
function win(){if(cur==unlocked){unlocked++;localStorage.setItem('cb3_unlocked',unlocked);coins+=40;localStorage.setItem('cb3_coins',coins);document.getElementById('coin').innerText=coins;}sfx(900);alert('🎉 Level '+cur+' Complete! +40 coins');closeGame();location.reload()}

function build(){
 let g=document.getElementById('grid');g.innerHTML='';
 for(let i=0;i<64;i++){
  let c=Math.floor(Math.random()*6);
  let el=document.createElement('div');el.className='c b'+c;el.dataset.c=c;el.innerHTML=['🍓','🍏','🔵','🍋','🍇','💎'][c];
  el.onclick=()=>{
   let s=g.querySelector('.sel');
   if(!s){el.classList.add('sel');sfx(400)}
   else if(s!==el){
    let t1=el.innerHTML,t2=el.className; el.innerHTML=s.innerHTML;el.className=s.className; s.innerHTML=t1;s.className=t2;
    g.querySelectorAll('.c').forEach(x=>x.classList.remove('sel'));
    sfx(700);
    let mv=document.getElementById('mv');mv.innerText=parseInt(mv.innerText)-1;
    if(parseInt(mv.innerText)<=0) setTimeout(win,400);
   }
  };
  g.appendChild(el);
 }
}
</script>
</body>
</html>
