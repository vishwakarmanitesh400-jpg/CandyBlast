<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANDY BLAST 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  body{background:radial-gradient(circle at top, #ffc4f0 0%, #a97bff 40%, #5a2bb8 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; font-family:'Nunito',sans-serif; overflow:hidden}
 .game-wrapper{width:390px; max-width:95vw; background:linear-gradient(180deg, #fff6ff 0%, #e8c6ff 100%); border-radius:30px; box-shadow:0 20px 40px rgba(0,0,0,0.3), inset 0 4px 0 white; padding:14px; border:4px solid #fff}
 .header{display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg,#2a1460,#4d2bb8); border-radius:20px; padding:10px 14px; color:white; box-shadow:0 6px 0 #1a0a45}
 .logo{font-family:'Fredoka One'; font-size:26px; color:#ff8df0; text-shadow:0 3px 0 #a1006e}
 .top-stats{display:flex; gap:8px}
 .pill{background:rgba(255,255,255,0.15); border-radius:14px; padding:4px 8px; font-size:12px; text-align:center; min-width:54px; border:1px solid rgba(255,255,255,0.3)}
 .pill b{display:block; font-size:16px; color:#ffe066}
 .board-wrap{background:linear-gradient(180deg,#c9a0ff,#8a5cff); border-radius:22px; padding:12px; margin:14px 0; box-shadow:inset 0 8px 20px rgba(0,0,0,0.3), 0 8px 0 #5e35c0; position:relative}
 .board{display:grid; grid-template-columns:repeat(8,1fr); gap:6px}
 .candy{aspect-ratio:1; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; transition:0.25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 5px 0 rgba(0,0,0,0.2), inset 0 3px 0 rgba(255,255,255,0.8)}
 .candy.selected{transform:scale(1.15) translateZ(30px); filter:brightness(1.3); box-shadow:0 12px 20px rgba(0,0,0,0.4), 0 0 0 3px white, 0 0 15px gold; z-index:10}
 .candy.matched{animation:blast 0.5s forwards}
  @keyframes blast{30%{transform:scale(1.4) rotate(10deg)} 100%{transform:scale(0) rotate(180deg); opacity:0}}
  @keyframes fall{0%{transform:translateY(-200px); opacity:0} 100%{transform:translateY(0); opacity:1}}
 .c-red{background:radial-gradient(circle at 30% 30%, #ff9a9a, #ff1a1a 60%, #a00000)}
 .c-blue{background:radial-gradient(circle at 30% 30%, #8ecfff, #0066ff 60%, #002a66)}
 .c-green{background:radial-gradient(circle at 30% 30%, #aaffb0, #00c853 60%, #005a26)}
 .c-yellow{background:radial-gradient(circle at 30% 30%, #fff9a0, #ffca00 60%, #b38600)}
 .c-purple{background:radial-gradient(circle at 30% 30%, #d9a0ff, #8e24ff 60%, #4a0099)}
 .c-orange{background:radial-gradient(circle at 30% 30%, #ffd1a0, #ff6d00 60%, #8a3800)}
 .footer{display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg,#b47cff,#6a3bff); border-radius:20px; padding:10px; box-shadow:0 6px 0 #4a249e}
 .btn{border:none; border-radius:16px; padding:8px 10px; font-family:'Fredoka One'; color:white; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.3)}
 .btn:active{transform:translateY(3px)}
 .btn-music{background:#00d1ff}.btn-hint{background:#ff4fd8}.btn-shuffle{background:#ffe600; color:#5a2b00}
 .score-bar{flex:1; margin:0 10px; background:rgba(0,0,0,0.3); border-radius:12px; padding:6px 10px; color:white; font-size:12px}
 .overlay{position:absolute; inset:0; background:rgba(40,10,90,0.85); border-radius:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; color:white; text-align:center; padding:20px}
 .overlay h1{font-family:'Fredoka One'; font-size:48px; color:#ffe600}
</style>
</head>
<body>
<div class="game-wrapper" style="position:relative">
  <div class="header"><div class="logo">CANDY<br>BLAST</div><div class="top-stats"><div class="pill">LEVEL<b id="level">1</b></div><div class="pill">MOVES<b id="moves">25</b></div><div class="pill">SCORE<b id="score">0</b></div></div></div>
  <div class="board-wrap"><div class="board" id="board"></div><div id="particles" style="position:absolute; inset:0; pointer-events:none"></div></div>
  <div class="footer"><button class="btn btn-music" id="musicBtn">🔊 MUSIC</button><div class="score-bar">TARGET: <b id="target">1000</b><div style="background:#0005; height:8px; border-radius:10px; margin-top:4px"><div id="progress" style="height:100%; width:0%; background:linear-gradient(90deg,#ffe600,#ff6a00)"></div></div></div><button class="btn btn-hint" id="hintBtn">💡</button><button class="btn btn-shuffle" id="shuffleBtn">🔀</button></div>
  <div class="overlay" id="startOverlay"><h1>CANDY BLAST 3D</h1><button class="btn" style="background:#ffe600; color:#4a0000; font-size:22px; padding:12px 30px; margin-top:12px" onclick="startGame()">PLAY NOW ▶</button></div>
  <div class="overlay" id="winOverlay" style="display:none"><h1 id="winText">LEVEL UP!</h1><p id="winScore"></p><button class="btn" style="background:#00ff88; color:#004422; font-size:20px; padding:12px 28px" onclick="nextLevel()">NEXT LEVEL 🚀</button></div>
</div>
<script>
const COLORS=['red','blue','green','yellow','purple','orange']; const EMOJI={red:'❤️',blue:'💎',green:'🍏',yellow:'🍋',purple:'🍇',orange:'🍊'};
let grid=[],selected=null,score=0,moves=25,level=1,target=1000,isBusy=false,audioCtx,musicOn=true,bgNodes=[],musicInterval;
const boardEl=document.getElementById('board'); const scoreEl=document.getElementById('score'),movesEl=document.getElementById('moves'),levelEl=document.getElementById('level'),targetEl=document.getElementById('target'),progEl=document.getElementById('progress');
function initAudio(){ if(audioCtx) return; audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playPop(p=1){ if(!audioCtx||!musicOn) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=300*p; g.gain.setValueAtTime(0.3,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3); }
function playBlast(){ [1,1.5,2].forEach((p,i)=>setTimeout(()=>playPop(p),i*70)); }
function startMusic(){ if(!audioCtx) initAudio(); if(musicInterval) clearInterval(musicInterval); const m=[261,329,392,523,392,329,261,392,329,392,440,523,659,523,440,392]; let i=0; musicInterval=setInterval(()=>{ if(!musicOn||!audioCtx) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=m[i%m.length]; o.type='triangle'; g.gain.setValueAtTime(0.06,audioCtx.currentTime); g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.4); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.4); i++; },280); }
function randColor(){ return COLORS[Math.floor(Math.random()*COLORS.length)] }
function createGrid(){ grid=[]; for(let r=0;r<8;r++){ grid[r]=[]; for(let c=0;c<8;c++){ let col; do{col=randColor();}while((r>=2&&grid[r-1][c]===col&&grid[r-2][c]===col)||(c>=2&&grid[r][c-1]===col&&grid[r][c-2]===col)); grid[r][c]=col; } } }
function render(){ boardEl.innerHTML=''; for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const d=document.createElement('div'); d.className=`candy c-${grid[r][c]}`; d.innerHTML=`<span>${EMOJI[grid[r][c]]}</span>`; d.style.animation=`fall ${0.3+r*0.04}s cubic-bezier(.34,1.56,.64,1)`; d.onclick=()=>onCandyClick(r,c,d); boardEl.appendChild(d); } updateUI(); }
function updateUI(){ scoreEl.textContent=score; movesEl.textContent=moves; levelEl.textContent=level; targetEl.textContent=target; progEl.style.width=Math.min(100,(score/target)*100)+'%'; }
function onCandyClick(r,c,el){ if(isBusy||moves<=0) return; initAudio(); if(!selected){ selected={r,c,el}; el.classList.add('selected'); playPop(1.2); } else { const {r:r1,c:c1,el:el1}=selected; if(r===r1&&c===c1){ el1.classList.remove('selected'); selected=null; return; } if(Math.abs(r-r1)+Math.abs(c-c1)!==1){ el1.classList.remove('selected'); selected={r,c,el}; el.classList.add('selected'); return; } el1.classList.remove('selected'); selected=null; swapCandies(r1,c1,r,c); } }
function swapCandies(r1,c1,r2,c2){ isBusy=true; [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]]; render(); setTimeout(()=>{ const m=findMatches(); if(m.length===0){ [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]]; render(); isBusy=false; playPop(0.7); } else { moves--; updateUI(); processMatches(); } },250); }
function findMatches(){ const matched=new Set(); for(let r=0;r<8;r++) for(let c=0;c<6;c++){ const col=grid[r][c]; if(col&&col===grid[r][c+1]&&col===grid[r][c+2]){ let k=c; while(k<8&&grid[r][k]===col){ matched.add(r+','+k); k++; } } } for(let c=0;c<8;c++) for(let r=0;r<6;r++){ const col=grid[r][c]; if(col&&col===grid[r+1][c]&&col===grid[r+2][c]){ let k=r; while(k<8&&grid[k][c]===col){ matched.add(k+','+c); k++; } } } return Array.from(matched).map(s=>{ const [r,c]=s.split(',').map(Number); return {r,c}; }); }
function processMatches(){ isBusy=true; const matches=findMatches(); if(matches.length===0){ isBusy=false; checkGameOver(); return; } score+=matches.length*50*level; if(matches.length>=4) score+=100; updateUI(); matches.forEach(({r,c})=>{ const el=boardEl.children[r*8+c]; if(el) el.classList.add('matched'); }); playBlast(); setTimeout(()=>{ matches.forEach(({r,c})=>{ grid[r][c]=null; }); for(let c=0;c<8;c++){ let w=7; for(let r=7;r>=0;r--) if(grid[r][c]!==null){ grid[w][c]=grid[r][c]; w--; } for(let r=w;r>=0;r--) grid[r][c]=randColor(); } render(); setTimeout(()=>processMatches(),400); },350); }
function checkGameOver(){ if(score>=target||moves<=0){ document.getElementById('winScore').textContent=`Score: ${score} / ${target}`; document.getElementById('winText').textContent=score>=target?'LEVEL COMPLETE! 🌟':'TRY AGAIN!'; document.getElementById('winOverlay').style.display='flex'; } }
function startGame(){ initAudio(); startMusic(); document.getElementById('startOverlay').style.display='none'; createGrid(); while(findMatches().length>0) createGrid(); score=0; moves=20+level*2; render(); }
function nextLevel(){ document.getElementById('winOverlay').style.display='none'; if(score>=target){ level++; target=Math.floor(target*1.6); } startGame(); }
document.getElementById('musicBtn').onclick=()=>{ initAudio(); musicOn=!musicOn; document.getElementById('musicBtn').textContent=musicOn?'🔊 MUSIC':'🔇 MUTED'; if(musicOn) startMusic(); else clearInterval(musicInterval); };
document.getElementById('hintBtn').onclick=()=>{ if(isBusy) return; for(let r=0;r<8;r++) for(let c=0;c<7;c++){ [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]]; if(findMatches().length>0){ [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]]; const e1=boardEl.children[r*8+c]; e1.style.boxShadow='0 0 0 3px white, 0 0 20px gold'; setTimeout(()=>e1.style.boxShadow='',800); return; } [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]]; } };
document.getElementById('shuffleBtn').onclick=()=>{ if(isBusy) return; let flat=grid.flat().sort(()=>Math.random()-0.5); for(let r=0;r<8;r++) for(let c=0;c<8;c++) grid[r][c]=flat[r*8+c]; render(); moves=Math.max(1,moves-1); updateUI(); };
createGrid(); render();
</script>
</body>
</html>
