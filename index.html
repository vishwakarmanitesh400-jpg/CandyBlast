<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BGMI 100 REAL</title><link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Teko',sans-serif;touch-action:none}body{background:#0a1a0a;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;max-width:480px;margin:auto;background:linear-gradient(#1a2a1a,#000);padding:8px 12px;display:flex;justify-content:space-between;color:#fff;z-index:99;border-bottom:3px solid #ffcc00}
#mapScreen{height:100vh;overflow-y:auto;background:#0a1a0a}.map{position:relative;width:100%;max-width:480px;margin:60px auto 0;height:3600px;background:#2a5a2a url('./map100.jpg') no-repeat top center;background-size:100% 100%}
.dot{position:absolute;width:46px;height:46px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 0 #000,0 6px 12px #0009;z-index:2;cursor:pointer}
.dot.ok{background:radial-gradient(circle at 30% 30%,#ffcc00,#ff8800 50%,#c00000)}.dot.lock{background:radial-gradient(#666,#222);filter:grayscale(1)}
.dot.cur{animation:b 0.7s infinite alternate;box-shadow:0 0 25px #ffcc00,0 4px 0 #000;z-index:10} @keyframes b{to{transform:translateY(-10px) scale(1.2)}}
#game{position:fixed;inset:0;z-index:200;background:radial-gradient(#2a5a2a,#0f2a0f);display:none;flex-direction:column;align-items:center}
#game.on{display:flex}.bar{width:95%;max-width:440px;margin-top:8px;background:#000c;padding:8px 12px;display:flex;justify-content:space-between;border:2px solid #ffcc00;color:#fff}
.board{width:95vw;max-width:410px;aspect-ratio:1;background:#1a3a1a;border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px;border:3px solid #ffcc00}
.cell{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 3px 0 #000;cursor:pointer}
.t0{background:radial-gradient(#ffcc00,#ff8800)}.t1{background:radial-gradient(#ff4444,#a00)}.t2{background:radial-gradient(#44ff44,#0a0)}.t3{background:radial-gradient(#44aaff,#005)}.t4{background:radial-gradient(#ff88ff,#a0a)}.t5{background:radial-gradient(#aaa,#555)}
</style></head><body>
<div class="top"><div>🔫 BGMI <b style="color:#ffcc00">100 LEVELS</b><br><small>REAL ERANGEL MAP</small></div><div style="display:flex;gap:8px;align-items:center"><div style="background:#000;border-radius:20px;padding:4px 10px;border:2px solid #ffcc00">🪙 <b id="coins">2500</b></div><div style="background:#ffcc00;color:#000;padding:4px 10px;border-radius:8px">LVL <b id="lt">1</b></div></div></div>
<div id="mapScreen"><div class="map" id="map"></div></div>
<div id="game"><div class="bar"><div>❤️ <span id="hp">3</span></div><div>LEVEL <b id="lv">1</b> - <span id="gt">Clear</span></div><div>MOVES <b id="mv">20</b> SCORE <b id="sc">0</b></div></div><div class="board" id="board"></div>
<div style="margin-top:12px;display:flex;gap:10px"><button onclick="closeG()" style="padding:8px 18px;background:#fff;border:3px solid #ffcc00;font-weight:700">⬅️ MAP</button><button onclick="shuffleB()" style="padding:8px 18px;background:#ffcc00;border:3px solid #fff;font-weight:700">🔀 SHUFFLE</button></div></div>
<script>
let unlocked=parseInt(localStorage.getItem('bgmi100_u')||'1');let coins=parseInt(localStorage.getItem('bgmi100_c')||'2500');
document.getElementById('lt').innerText=unlocked;document.getElementById('coins').innerText=coins;
const mapEl=document.getElementById('map'); const names=["Military Base","Ferry Pier","Mylta","Farm","Pochinki","School","Rozhok","Mansion","Georgopol","Stalber","Severny","Sosnovka","🏆 CHICKEN DINNER!"];
for(let i=1;i<=100;i++){let p=(i-1)/99,y=95-p*90,w=Math.sin(p*18)*10,x=50+w;let d=document.createElement('div');d.className='dot '+(i>unlocked?'lock':(i==unlocked?'ok cur':'ok'));d.style.left=x+'%';d.style.top=y+'%';d.style.marginLeft='-23px';d.style.marginTop='-23px';if(i%10==0||i==1||i==100){d.style.width='56px';d.style.height='56px';d.style.marginLeft='-28px';d.style.fontSize='11px';d.innerText=names[Math.floor(i/10)]}else d.innerText=i>unlocked?'🔒':i;if(i==100){d.style.width='70px';d.style.height='70px';d.style.background='radial-gradient(gold,#ff8800)';d.innerText='👑100';d.style.fontSize='16px'}d.onclick=()=>{if(i>unlocked){alert('🔒 Locked! Level '+unlocked+' jito pehle! - '+names[Math.floor(unlocked/10)]);return}openL(i)};mapEl.appendChild(d);}
setTimeout(()=>document.getElementById('mapScreen').scrollTop=99999,800);
let EMO=["🔫","🪖","💣","🎯","🩸","💊"],N=8,grid=[],score=0,moves=0,need=12,cur=1; const boardEl=document.getElementById('board');
function openL(l){cur=l;document.getElementById('lv').innerText=l;need=10+Math.floor(l/2);moves=20+Math.floor(l/5);score=0;document.getElementById('gt').innerText=names[Math.floor(l/10)]||'Clear '+need;initB();document.getElementById('game').classList.add('on');}
function closeG(){document.getElementById('game').classList.remove('on')} function rnd(){return Math.floor(Math.random()*6)}
function initB(){grid=[];for(let r=0;r<N;r++){grid[r]=[];for(let c=0;c<N;c++)grid[r][c]=rnd();}drawB();} function isM(r,c){let v=grid[r][c];if(c>=2&&grid[r][c-1]==v&&grid[r][c-2]==v)return true;if(r>=2&&grid[r-1][c]==v&&grid[r-2][c]==v)return true;return false}
function drawB(){boardEl.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let d=document.createElement('div');d.className='cell t'+grid[r][c];d.innerHTML=EMO[grid[r][c]];d.dataset.r=r;d.dataset.c=c;d.onclick=clickCell;boardEl.appendChild(d);}document.getElementById('mv').innerText=moves;document.getElementById('sc').innerText=score;}
let sel=null; function clickCell(){let r=+this.dataset.r,c=+this.dataset.c;if(!sel){sel={r,c};this.style.outline='3px solid #ffcc00';return}let dr=Math.abs(sel.r-r),dc=Math.abs(sel.c-c);if((dr==1&&dc==0)||(dr==0&&dc==1)){let t=grid[sel.r][sel.c];grid[sel.r][sel.c]=grid[r][c];grid[r][c]=t;let m=findM();if(m.length>0){moves--;score+=m.length*50;setTimeout(()=>{proc(m)},200);}else{t=grid[sel.r][sel.c];grid[sel.r][sel.c]=grid[r][c];grid[r][c]=t;}}sel=null;drawB();checkW();}
function findM(){let s=new Set();for(let r=0;r<N;r++)for(let c=0;c<N-2;c++){let v=grid[r][c];if(v==grid[r][c+1]&&v==grid[r][c+2]){let k=c;while(k<N&&grid[r][k]==v){s.add(r+','+k);k++;}}}for(let c=0;c<N;c++)for(let r=0;r<N-2;r++){let v=grid[r][c];if(v==grid[r+1][c]&&v==grid[r+2][c]){let k=r;while(k<N&&grid[k][c]==v){s.add(k+','+c);k++;}}}return [...s].map(x=>{let[r,c]=x.split(',').map(Number);return{r,c}});}
function proc(ms){ms.forEach(({r,c})=>{for(let rr=r;rr>0;rr--)grid[rr][c]=grid[rr-1][c];grid[0][c]=rnd();});drawB();let more=findM();if(more.length>0){score+=more.length*80;setTimeout(()=>proc(more),200);}else checkW();}
function checkW(){if(score>=need*50){if(cur==unlocked){unlocked++;localStorage.setItem('bgmi100_u',unlocked);coins+=100;localStorage.setItem('bgmi100_c',coins);}alert('🏆 WINNER WINNER CHICKEN DINNER! Level '+cur+' - '+names[Math.floor(cur/10)]);closeG();location.reload()} if(moves<=0){alert('💀 ELIMINATED! Moves khatam!');closeG();}}
function shuffleB(){for(let i=0;i<100;i++){let r1=Math.floor(Math.random()*N),c1=Math.floor(Math.random()*N),r2=Math.floor(Math.random()*N),c2=Math.floor(Math.random()*N);let t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t;}drawB();moves--;}
</script></body></html>
