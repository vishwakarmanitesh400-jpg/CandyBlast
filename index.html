<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Blast - Web Edition</title>
    <style>
        body {
            background: linear-gradient(135deg, #2b1055, #7597de);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            user-select: none;
        }

        .header {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
        }

        .score-box {
            font-size: 20px;
            font-weight: bold;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(6, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 5px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #fff;
        }

        .candy {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-sizing: border-box;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.3);
        }

        .candy:hover {
            transform: scale(1.05);
        }

        .selected {
            border: 4px solid #fff;
            transform: scale(0.9);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.05); }
        }

        .btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            font-weight: bold;
        }

        .btn:hover {
            background: #e91e63;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="score-box">MOVES: <span id="moves">15</span></div>
    </div>

    <div id="game-board"></div>

    <button class="btn" onclick="startAudio()">🔊 Click to Enable Sound / Start Music</button>

    <script>
        const width = 6;
        const board = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const movesDisplay = document.getElementById('moves');
        
        const candyTypes = ['🍬', '🍭', '🍩', '🍫', '🧁'];
        let grid = [];
        let score = 0;
        let moves = 15;
        let firstSquare = null;
        let secondSquare = null;

        // Audio System (Web Audio API)
        let audioCtx;
        let isMusicPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(freq, duration, type='sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playMatchSound() {
            playSound(523.25, 0.1); // C5
            setTimeout(() => playSound(659.25, 0.1), 80); // E5
            setTimeout(() => playSound(783.99, 0.2), 160); // G5
        }

        function startAudio() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!isMusicPlaying) {
                isMusicPlaying = true;
                playBackgroundMusic();
            }
        }

        function playBackgroundMusic() {
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            let noteIndex = 0;
            setInterval(() => {
                if (isMusicPlaying) {
                    playSound(notes[noteIndex], 0.15, 'triangle');
                    noteIndex = (noteIndex + 1) % notes.length;
                }
            }, 300);
        }

        // Game Board Setup
        function createBoard() {
            board.innerHTML = '';
            grid = [];
            for (let i = 0; i < width * width; i++) {
                const candy = document.createElement('div');
                candy.classList.add('candy');
                candy.setAttribute('data-id', i);
                let randomCandy = candyTypes[Math.floor(Math.random() * candyTypes.length)];
                candy.innerText = randomCandy;
                candy.addEventListener('click', selectCandy);
                board.appendChild(candy);
                grid.push(candy);
            }
            checkMatches();
        }

        function selectCandy() {
            if (moves <= 0) return;

            if (!firstSquare) {
                firstSquare = this;
                firstSquare.classList.add('selected');
                playSound(400, 0.05);
            } else if (!secondSquare && this !== firstSquare) {
                secondSquare = this;
                const id1 = parseInt(firstSquare.getAttribute('data-id'));
                const id2 = parseInt(secondSquare.getAttribute('data-id'));

                const validMoves = [id1 - 1, id1 + 1, id1 - width, id1 + width];
                if (validMoves.includes(id2)) {
                    swapCandies(firstSquare, secondSquare);
                    moves--;
                    movesDisplay.innerText = moves;
                    setTimeout(checkMatches, 200);
                }

                firstSquare.classList.remove('selected');
                firstSquare = null;
                secondSquare = null;
            } else {
                firstSquare.classList.remove('selected');
                firstSquare = null;
            }
        }

        function swapCandies(c1, c2) {
            let temp = c1.innerText;
            c1.innerText = c2.innerText;
            c2.innerText = temp;
        }

        function checkMatches() {
            let matched = false;

            // Check Row Matches
            for (let i = 0; i < 36; i++) {
                if (i % width < width - 2) {
                    if (grid[i].innerText !== '' &&
                        grid[i].innerText === grid[i + 1].innerText &&
                        grid[i].innerText === grid[i + 2].innerText) {
                        
                        grid[i].innerText = '';
                        grid[i + 1].innerText = '';
                        grid[i + 2].innerText = '';
                        score += 30;
                        matched = true;
                    }
                }
            }

            // Check Column Matches
            for (let i = 0; i < 24; i++) {
                if (grid[i].innerText !== '' &&
                    grid[i].innerText === grid[i + width].innerText &&
                    grid[i].innerText === grid[i + 2 * width].innerText) {

                    grid[i].innerText = '';
                    grid[i + width].innerText = '';
                    grid[i + 2 * width].innerText = '';
                    score += 30;
                    matched = true;
                }
            }

            if (matched) {
                scoreDisplay.innerText = score;
                playMatchSound();
                setTimeout(dropCandies, 250);
            }
        }

        function dropCandies() {
            for (let i = 35; i >= 0; i--) {
                if (grid[i].innerText === '') {
                    if (i < width) {
                        grid[i].innerText = candyTypes[Math.floor(Math.random() * candyTypes.length)];
                    } else {
                        grid[i].innerText = grid[i - width].innerText;
                        grid[i - width].innerText = '';
                    }
                }
            }
            
            // Re-check for new fall matches
            let emptySpaces = grid.some(c => c.innerText === '');
            if (emptySpaces) {
                setTimeout(dropCandies, 150);
            } else {
                setTimeout(checkMatches, 150);
            }
        }

        createBoard();
    </script>
</body>
</html>
