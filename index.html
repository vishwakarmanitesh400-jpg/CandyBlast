<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Blast PRO - 100 Levels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(#ff8ec7,#a18cd1);min-height:100vh}
.header{background:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
.logo{color:#ff3e8d;font-weight:700;font-size:18px}
.coins{background:gold;padding:5px 12px;border-radius:20px;font-weight:700}
.map{max-width:420px;margin:0 auto;padding:15px 10px 100px}
.world{background:#fff;border-radius:20px;padding:15px;margin:18px 0}
.world-title{text-align:center;color:#ff3e8d;font-weight:700;margin-bottom:12px;font-size:18px}
.levels{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.lvl{width:56px;height:56px;background:#fff;border:3px solid #ff3e8d;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 4px 0 #c41e5f}
.lvl.locked{background:#ddd;border-color:#999;color:#777}
.hut{text-align:center;font-size:36px}
</style>
</head>
<body>
<div class="header"><div class="logo">🍭 CANDY BLAST PRO</div><div class="coins">🪙 250</div></div>
<div class="map" id="map"></div>
<script>
let unlocked=parseInt(localStorage.getItem('candy_unlocked')||'1');
let worlds=[{t:"🏠 Candy Town 1-20",s:1,e:20},{t:"🏡 Sweet Village 21-40",s:21,e:40},{t:"🏰 Chocolate Castle 41-60",s:41,e:60},{t:"🎪 Carnival 61-80",s:61,e:80},{t:"🍭 Rainbow 81-100",s:81,e:100}];
let h="";
worlds.forEach(w=>{
h+=`<div class="world"><div class="hut">🏠</div><div class="world-title">${w.t}</div><div class="levels">`;
for(let i=w.s;i<=w.e;i++){let c=i>unlocked?"lvl locked":"lvl";let txt=i>unlocked?"🔒":i;h+=`<div class="${c}" onclick="if(${i}>unlocked)alert('Locked');else{alert('Level ${i} Play!');if(${i}==unlocked){localStorage.setItem('candy_unlocked',${i}+1);location.reload()}}">${txt}</div>`}
h+=`</div></div>`;
});
document.getElementById('map').innerHTML=h;
</script>
</body>
</html>
