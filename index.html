<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Candy World Real</title><style>@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Fredoka',sans-serif;overflow:hidden;background:#000}.header{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(#fff,#ffd0e8);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 0 #ff2d7a;border-radius:0 0 18px 18px}#scroll{height:100vh;overflow-y:auto;padding-top:68px}.world{position:relative;max-width:430px;margin:0 auto;height:2800px;background:url(./candy_bg.jpg) no-repeat top center;background-size:100% 100%}.dot{position:absolute;width:58px;height:58px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;z-index:10;box-shadow:0 7px 0 rgba(0,0,0,.4),0 12px 25px rgba(0,0,0,.5);cursor:pointer;transform:perspective(400px) rotateX(18deg)}.dot.ok{background:radial-gradient(circle at 30% 30%,#fff,#ff3d8a 50%,#c0003a)}.dot.lock{background:radial-gradient(#ddd,#666)}.dot.cur{animation:pop.7s infinite alternate}@keyframes pop{to{transform:perspective(400px) rotateX(6deg) translateY(-10px) scale(1.15)}}#game{position:fixed;inset:0;z-index:200;background:radial-gradient(#ff9ed2,#7c3aed);display:none;flex-direction:column}#game.on{display:flex}.grid{width:92vw;max-width:360px;aspect-ratio:1;background:linear-gradient(#fff,#ffe6f2);margin:14px auto;border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;border:4px solid #fff;box-shadow:0 12px 0 #e89ab8,0 25px 50px rgba(0,0,0,.4)}.c{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 5px 0 rgba(0,0,0,.15);transform:perspective(300px) rotateX(14deg);transition:.2s}.c.sel{transform:translateY(-12px) scale(1.25)}.b0{background:linear-gradient(#ff7a7a,#ff1a1a)}.b1{background:linear-gradient(#7aff8a,#00e63a)}.b2{background:linear-gradient(#7ab8ff,#1a8aff)}.b3{background:linear-gradient(#ffec7a,#ffcc00)}.b4{background:linear-gradient(#d78aff,#9d1aff)}.b5{background:linear-gradient(#7affef,#00e6c8)}</style></head><body><div class="header"><div>🍭 CANDY WORLD</div><div style="display:flex;gap:8px"><button id="musicBtn" style="background:#fff;border:2px solid #ff2d7a;border-radius:20px;padding:4px 10px">🔊</button><span style="background:linear-gradient(#ffe95c,#ffb400);padding:5px 10px;border-radius:20px;border:2px solid #fff">🪙 <span id="coin">250</span></span></div></div><div id="scroll"><div class="world" id="world"></div></div><div id="game"><div style="display:flex;justify-content:space-between;padding:12px;color:#fff;font-weight:700"><span onclick="document.getElementById('game').classList.remove('on')" style="background:#fff;color:#ff2d7a;padding:6px 14px;border-radius:20px">⬅️ MAP</span><span>LEVEL <b id="lv">1</b></span><span>MOVES <b id="mv">20</b></span></div><div class="grid" id="grid"></div><div style="text-align:center;color:#fff;margin-top:10px">✨ Swap Candies ✨</div></div><audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_1a2a8f6b8e.mp3"></audio><script>let unlocked=parseInt(localStorage.getItem('cb_real_unlocked')||'1'),coins=parseInt(localStorage.getItem('cb_real_coins')||'250');document.getElementById('coin').innerText=coins;let bgm=document.getElementById('bgm'),isPlay=false;document.getElementById('musicBtn').onclick=()=>{if(!isPlay){bgm.volume=0.4;bgm.play();document.getElementById('musicBtn').innerText='🔊';isPlay=true}else{bgm.pause();document.getElementById('musicBtn').innerText='🔇';isPlay=false}};function sfx(f){try{let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.value=0.3;o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);o.stop(ctx.currentTime+0.3)}catch(e){}}let roadPath=[{l:1,x:47,y:96},{l:2,x:52,y:91},{l:3,x:60,y:87},{l:4,x:68,y:82.5},{l:5,x:60,y:77.5},{l:6,x:48,y:73.5},{l:7,x:40,y:68},{l:8,x:48,y:62},{l:9,x:60,y:57},{l:10,x:68,y:52},{l:11,x:58,y:47.5},{l:12,x:45,y:44},{l:13,x:42,y:38.5},{l:14,x:52,y:34},{l:15,x:48,y:28},{l:16,x:48,y:22},{l:17,x:50,y:16},{l:18,x:51,y:10},{l:19,x:50,y:5},{l:20,x:50,y:1.5}];let world=document.getElementById('world');roadPath.forEach(p=>{let d=document.createElement('div');d.className='dot '+(p.l>unlocked?'lock':(p.l==unlocked?'ok cur':'ok'));d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.marginLeft='-29px';d.style.marginTop='-29px';d.innerText=p.l>unlocked?'🔒':p.l;d.onclick=()=>openGame(p.l);world.appendChild(d)});setTimeout(()=>{document.getElementById('scroll').scrollTop=document.getElementById('scroll').scrollHeight},800);let cur=1;function openGame(n){if(n>unlocked){sfx(150);alert('🔒 Locked');return}cur=n;document.getElementById('lv').innerText=n;document.getElementById('mv').innerText=20+Math.floor(n/2);document.getElementById('game').classList.add('on');build();sfx(600)}function win(){if(cur==unlocked){unlocked++;localStorage.setItem('cb_real_unlocked',unlocked);coins+=50;localStorage.setItem('cb_real_coins',coins);document.getElementById('coin').innerText=coins}sfx(900);alert('🎉 Level '+cur+' WIN! +50 coins');document.getElementById('game').classList.remove('on');location.reload()}function build(){let g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<64;i++){let c=Math.floor(Math.random()*6),el=document.createElement('div');el.className='c b'+c;el.innerHTML=['🍓','🍏','💙','🍋','🍇','💎'][c];el.onclick=()=>{let s=g.querySelector('.sel');if(!s){el.classList.add('sel');sfx(400)}else if(s!==el){let t1=el.innerHTML,t2=el.className;el.innerHTML=s.innerHTML;el.className=s.className;s.innerHTML=t1;s.className=t2;g.querySelectorAll('.c').forEach(x=>x.classList.remove('sel'));sfx(700);let mv=document.getElementById('mv');mv.innerText=parseInt(mv.innerText)-1;if(parseInt(mv.innerText)<=0)setTimeout(win,300)}};g.appendChild(el)}}</script></body></html>
