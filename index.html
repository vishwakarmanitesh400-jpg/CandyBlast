<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candy World 3D</title><style>@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Fredoka',sans-serif;overflow:hidden}#scroll{height:100vh;overflow-y:auto;padding-top:60px;background:linear-gradient(#87e1ff,#7dd87d)}.world{position:relative;max-width:430px;margin:0 auto;height:2800px;background:url(https://i.imgur.com/8Km9tLL.jpg) no-repeat top center;background-size:100% 100%;background-color:#7dd87d}.dot{position:absolute;width:62px;height:62px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;z-index:10;box-shadow:0 7px 0 rgba(0,0,0,.4),0 12px 25px rgba(0,0,0,.5);cursor:pointer;transform:perspective(400px) rotateX(18deg)}.dot.ok{background:radial-gradient(circle at 30% 30%,#fff,#ff3d8a 50%,#c0003a)}.dot.lock{background:radial-gradient(#ddd,#666)}.dot.cur{animation:pop .7s infinite alternate}@keyframes pop{to{transform:perspective(400px) rotateX(6deg) translateY(-10px) scale(1.15)}}</style></head><body><div style="position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(#fff,#ffd0e8);padding:10px 14px;display:flex;justify-content:space-between;box-shadow:0 5px 0 #ff2d7a;border-radius:0 0 18px 18px;font-family:'Fredoka',sans-serif"><b>🍭 CANDY WORLD 3D</b><span style="background:gold;padding:5px 10px;border-radius:20px;border:2px solid #fff">LVL <span id="lvl">1</span></span></div><div id="scroll"><div class="world" id="world"></div></div><script>let unlocked=parseInt(localStorage.getItem('cb3')||'1');let path=[{l:1,x:47,y:96},{l:2,x:52,y:91},{l:3,x:60,y:87},{l:4,x:68,y:82.5},{l:5,x:60,y:77.5},{l:6,x:48,y:73.5},{l:7,x:40,y:68},{l:8,x:48,y:62},{l:9,x:60,y:57},{l:10,x:68,y:52},{l:11,x:58,y:47.5},{l:12,x:45,y:44},{l:13,x:42,y:38.5},{l:14,x:52,y:34},{l:15,x:48,y:28},{l:16,x:48,y:22},{l:17,x:50,y:16},{l:18,x:51,y:10},{l:19,x:50,y:5},{l:20,x:50,y:1.5}];let w=document.getElementById('world');path.forEach(p=>{let d=document.createElement('div');d.className='dot '+(p.l>unlocked?'lock':(p.l==unlocked?'ok cur':'ok'));d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.marginLeft='-31px';d.style.marginTop='-31px';d.innerText=p.l>unlocked?'🔒':p.l;d.onclick=()=>{if(p.l>unlocked){alert('Locked');return}if(p.l==unlocked){localStorage.setItem('cb3',unlocked+1);alert('Level '+p.l+' Win! Next unlocked');location.reload()}else alert('Level '+p.l+' Play!')};w.appendChild(d)});setTimeout(()=>{document.getElementById('scroll').scrollTop=document.getElementById('scroll').scrollHeight;document.getElementById('lvl').innerText=unlocked},800);</script></body></html>
