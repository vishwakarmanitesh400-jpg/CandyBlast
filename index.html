<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Candy Blast - Touch & Slide Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        body { background: #120826; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .screen { display: none; width: 100%; max-width: 420px; height: 100vh; max-height: 850px; flex-direction: column; align-items: center; position: relative; background-size: cover; background-position: center; border: 2px solid #555; border-radius: 20px; overflow: hidden; }
        .active { display: flex; }

        /* Splash Screen */
        #splash-screen { background-image: url('36318.png'); justify-content: flex-end; padding-bottom: 50px; }
        .play-btn { background: linear-gradient(180deg, #ff9800, #f57c00); border: 3px solid #fff; padding: 15px 50px; font-size: 24px; font-weight: bold; color: white; border-radius: 30px; cursor: pointer; box-shadow: 0 8px 0 #b26a00; text-shadow: 1px 1px 2px #000; }

        /* Map Screen */
        #map-screen { background: linear-gradient(180deg, #4a148c, #880e4f); padding: 20px; overflow-y: auto; }
        .map-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; padding-bottom: 30px; }
        .level-node { width: 65px; height: 65px; background: linear-gradient(180deg, #00e676, #00a152); border: 3px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; box-shadow: 0 5px 0 #006000; cursor: pointer; }
        .level-node.locked { background: #555; box-shadow: 0 5px 0 #333; opacity: 0.6; cursor: not-allowed; }

        /* Game Screen */
        #game-screen { background-image: url('36298_2.jpg'); justify-content: space-between; padding: 20px 10px; }
        .hud { width: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 10px 15px; border-radius: 15px; display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; border: 2px solid #ff4081; }
        #board { display: grid; grid-template-columns: repeat(6, 55px); grid-template-rows: repeat(6, 55px); gap: 5px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 12px; border: 3px solid #fff; position: relative; }
        .candy { width: 55px; height: 55px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); user-select: none; }
    </style>
</head>
<body>

    <div id="splash-screen" class="screen active">
        <button class="play-btn" onclick="goToMap()">PLAY</button>
    </div>

    <div id="map-screen" class="screen">
        <div class="map-title">SELECT LEVEL (1-100)</div>
        <div class="levels-grid" id="levels-container"></div>
    </div>

    <div id="game-screen" class="screen">
        <div class="hud">
            <div>LVL: <span id="lvl-num">1</span></div>
            <div>SCORE: <span id="score">0</span></div>
            <div>MOVES: <span id="moves">15</span></div>
        </div>

        <div id="board"></div>

        <button class="play-btn" style="font-size:16px; padding:10px 20px;" onclick="goToMap()">← MAP</button>
    </div>

    <script>
        const width = 6;
        let score = 0;
        let moves = 15;
        let audioCtx;
        const candyTypes = ['🍬', '🍭', '🍩', '🍫', '🧁'];
        let grid = [];
        
        let startX = 0, startY = 0;
        let draggedCandy = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startBGM();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, duration=0.1) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startBGM() {
            const notes = [261, 329, 392, 523];
            let i = 0;
            setInterval(() => {
                if (audioCtx) playSound(notes[i++ % notes.length], 0.2);
            }, 400);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToMap() {
            initAudio();
            showScreen('map-screen');
            renderMap();
        }

        function renderMap() {
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                let btn = document.createElement('div');
                btn.className = 'level-node' + (i > 5 ? ' locked' : '');
                btn.innerText = i;
                if (i <= 5) btn.onclick = () => startGame(i);
                container.appendChild(btn);
            }
        }

        function startGame(lvl) {
            score = 0;
            moves = 15;
            document.getElementById('lvl-num').innerText = lvl;
            document.getElementById('score').innerText = score;
            document.getElementById('moves').innerText = moves;
            showScreen('game-screen');
            createBoard();
        }

        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            grid = [];
            for (let i = 0; i < width * width; i++) {
                let candy = document.createElement('div');
                candy.className = 'candy';
                candy.innerText = candyTypes[Math.floor(Math.random() * candyTypes.length)];
                candy.setAttribute('data-id', i);
                
                // Touch Slide Controls
                candy.addEventListener('touchstart', handleStart);
                candy.addEventListener('touchend', handleEnd);
                candy.addEventListener('mousedown', handleStart);
                candy.addEventListener('mouseup', handleEnd);

                board.appendChild(candy);
                grid.push(candy);
            }
        }

        function handleStart(e) {
            if (moves <= 0) return;
            draggedCandy = this;
            let touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
        }

        function handleEnd(e) {
            if (!draggedCandy) return;
            let touch = e.changedTouches ? e.changedTouches[0] : e;
            let diffX = touch.clientX - startX;
            let diffY = touch.clientY - startY;

            let id = parseInt(draggedCandy.getAttribute('data-id'));
            let targetId = null;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && id % width !== width - 1) targetId = id + 1; // Right
                else if (diffX < -30 && id % width !== 0) targetId = id - 1; // Left
            } else {
                if (diffY > 30 && id + width < 36) targetId = id + width; // Down
                else if (diffY < -30 && id - width >= 0) targetId = id - width; // Up
            }

            if (targetId !== null) {
                swap(draggedCandy, grid[targetId]);
                moves--;
                score += 10;
                document.getElementById('moves').innerText = moves;
                document.getElementById('score').innerText = score;
                playSound(600);
            }
            draggedCandy = null;
        }

        function swap(c1, c2) {
            let temp = c1.innerText;
            c1.innerText = c2.innerText;
            c2.innerText = temp;
        }
    </script>
</body>
</html>
